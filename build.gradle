plugins {
  id 'java'
  id 'application'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.5'
}


group = 'com.isthisalis'
version = '1.0.0'

application {
    mainClass.set('com.isthisalis.website.Website')
}

jar {
    manifest.attributes('Main-Class': 'com.isthisalis.website.Website')
}


java {
  sourceCompatibility = '21'
  targetCompatibility = '21'
}


repositories {
  mavenCentral()
}


dependencies {
   implementation 'org.springframework.boot:spring-boot-starter-web:4.1.0'
   implementation 'org.springframework.boot:spring-boot-starter-data-rest'
   implementation 'org.springframework.boot:spring-boot-starter-security'
   //implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

   implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.0'
   //implementation 'com.h2database:h2:2.4.240'
   implementation 'org.postgresql:postgresql'

   compileOnly 'org.projectlombok:lombok:1.18.46'
   annotationProcessor 'org.projectlombok:lombok:1.18.46'
}
